[package]
name = "astra-server"
version = "0.1.0"
edition = "2021"
description = "ASTRA Telemetry Web Server, WebSocket Broadcaster & Main Application"

[dependencies]
astra-core = { path = "../astra-core" }
astra-sensors = { path = "../astra-sensors" }
astra-analytics = { path = "../astra-analytics" }
astra-telemetry = { path = "../astra-telemetry" }

tokio = { version = "1.0", features = ["full"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"
